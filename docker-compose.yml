version: '2'

services:
  mariadb:
    image: docker.io/bitnami/mariadb:10.6
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - MARIADB_USER=symfony
      - MARIADB_DATABASE=symfonydb
      - MARIADB_PASSWORD=P@ssw0rd
      - MARIADB_ROOT_PASSWORD=P@ssw0rd
  myapp:
    image: docker.io/bitnami/symfony:6.2
    ports:
      - '8000:8000'
    environment:
      - ALLOW_EMPTY_PASSWORD=no
      - SYMFONY_DATABASE_HOST=localhost
      - SYMFONY_DATABASE_PORT_NUMBER=3306
      - SYMFONY_DATABASE_USER=symfony
      - SYMFONY_DATABASE_NAME=symfonydb
      - SYMFONY_DATABASE_PASSWORD=P@ssw0rd
      - SYMFONY_DATABASE_ROOT_PASSWORD=P@ssw0rd
      - SYMFONY_PROJECT_SKELETON=symfony/skeleton
    volumes:
      - './my-project:/app'
    depends_on:
      - mariadb
  phpmyadmin:
    image: docker.io/bitnami/phpmyadmin:5
    ports:
      - '8080:8080'
    environment:
      - PMA_HOST=localhost
      - PMA_PORT=3306
    depends_on:
      - mariadb

